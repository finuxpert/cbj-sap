    # Production Rundeck API routes are intentionally split from the legacy
    # Evidence/Case API. /api/health and all unmatched /api/* requests continue
    # to the existing sphere-api service on port 8090.
    location = /api/events {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/events;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control no-cache always;
    }

    location = /api/analysis/performance {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/analysis/performance;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }

    location = /api/platform/health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/platform/health;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }

    location = /api/collect-now/status {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/collect-now/status;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }

    # Production Collect Now remains intentionally blocked until production
    # authentication/authorization is explicitly enabled.
    location = /api/collect-now {
        return 403;
    }

    location = /api/collections {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/collections;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }

    location /api/collections/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/collections/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }

    location /api/history/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/history/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }
