    # Production frontend uses /api. Keep legacy Evidence/Case endpoints on
    # sphere-api:8090, while the more-specific Rundeck paths below use 8092.
    # The existing /sap-api/ route remains available for compatibility.
    location = /api/events {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/events;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control no-cache always;
    }

    location = /api/analysis/performance {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/analysis/performance;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }

    location = /api/platform/health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/platform/health;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }

    location = /api/collect-now/status {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/collect-now/status;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }

    # Production Collect Now remains intentionally blocked until production
    # authentication/authorization is explicitly enabled.
    location = /api/collect-now {
        return 403;
    }

    location = /api/collections {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/collections;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }

    location /api/collections/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/collections/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }

    location /api/history/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092/history/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }

    # All other /api/* routes are the existing Evidence/Case API.
    location = /api { return 308 /api/; }
    location /api/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control no-store always;
    }
