    location = /dev { return 308 /dev/; }

    # Collect Now is the only mutating /dev API route. All other /dev API routes stay GET-only.
    location = /dev/api/collect-now {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8091/collect-now;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-User $remote_user;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }

    # SSE must not be buffered by Nginx, otherwise dashboard events arrive in batches.
    location = /dev/api/events {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8091/events;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control no-cache always;
    }

    location /dev/api/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }
    location /dev/assets/ {
        alias /var/www/sphere-dev/current/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /dev/ {
        alias /var/www/sphere-dev/current/;
        try_files $uri $uri/ /dev/index.html;
        add_header Cache-Control no-store always;
    }
