    location = /monitoring { return 302 /monitoring/; }

    location ^~ /monitoring/api/ {
        auth_basic "CBJ Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd-cbj-monitoring;
        rewrite ^/monitoring/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /monitoring/ {
        auth_basic "CBJ Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd-cbj-monitoring;
        root /var/www/html;
        try_files $uri $uri/ /monitoring/index.html;
    }
