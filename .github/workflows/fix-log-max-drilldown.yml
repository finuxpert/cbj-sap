name: Temporary LOG MAX Drilldown Fixer

on:
  push:
    branches:
      - fix-log-max-drilldown
    paths:
      - .github/workflows/fix-log-max-drilldown.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix-log-max-drilldown
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/fix-log-max-drilldown.py

      - name: Validate
        run: |
          set -Eeuo pipefail
          npm ci
          npm run lint
          npm test
          npm run build
          npm audit

      - name: Commit validated fix
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tools/logSampleDrilldown.js src/tools/__tests__/logSampleDrilldown.test.js src/tools/ToolLogAutoSphereV5.jsx src/tools/components/VirtualResourceTableV14.jsx src/tools/components/LogLandscapeEChartV14.jsx
          git diff --cached --check
          git commit -m 'fix: restore metric-aware LOG max drilldown'
          git push origin HEAD:fix-log-max-drilldown
