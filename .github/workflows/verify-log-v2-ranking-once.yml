name: ONCE - Verify LOG v2 ranking

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/verify-log-v2-ranking-once.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Static adaptive-ranking check
        run: |
          grep -q "JS_FAST_PATH" src/tools/duckdbResourceAnalytics.js
          grep -q "DUCKDB_THRESHOLD" src/tools/duckdbResourceAnalytics.js
          grep -q "withTimeout" src/tools/duckdbResourceAnalytics.js
      - name: Build production bundle
        run: npm run build -- --base=/sap/
