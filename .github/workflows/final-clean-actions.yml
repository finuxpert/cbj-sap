name: Final Clean Actions

on:
  push:
    branches:
      - cleanup-unused-files

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export GH_TOKEN GITHUB_REPOSITORY

          for attempt in $(seq 1 5); do
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[].id' > /tmp/completed_ids.txt

            total=$(wc -l < /tmp/completed_ids.txt | tr -d ' ')
            echo "Completed runs found: ${total}"
            if [ "${total}" -eq 0 ]; then
              exit 0
            fi

            xargs -r -n1 -P4 bash -c '
              run_id="$1"
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null 2>&1 || true
            ' _ < /tmp/completed_ids.txt

            sleep 1
          done

          remaining=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=1" \
            --jq '.total_count')
          echo "Completed runs remaining: ${remaining}"
          [ "${remaining}" -eq 0 ]
