name: Temporary SheetJS Security Upgrade

on:
  push:
    branches:
      - security-npm-audit
    paths:
      - .github/workflows/npm-sheetjs-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade-sheetjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-npm-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade to official SheetJS CE 0.20.3 tarball
        shell: bash
        run: |
          set -euo pipefail
          npm install --save https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
          node -e "const p=require('./package.json'); console.log('xlsx dependency:', p.dependencies.xlsx)"
      - name: Validate clean locked install
        run: npm ci
      - name: Validate XLSX and legacy XLS round-trip support
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import * as XLSX from 'xlsx'
          const rows = [['Transaction','Response Time','DB Time'],['VA01',1234,400],['SE16',987,120]]
          const ws = XLSX.utils.aoa_to_sheet(rows)
          const wb = XLSX.utils.book_new()
          XLSX.utils.book_append_sheet(wb, ws, 'ST03N')
          for (const bookType of ['xlsx','xls']) {
            const out = XLSX.write(wb, { type: 'array', bookType })
            const read = XLSX.read(out, { type: 'array' })
            const matrix = XLSX.utils.sheet_to_json(read.Sheets[read.SheetNames[0]], { header: 1, raw: true })
            if (matrix?.[1]?.[0] !== 'VA01' || Number(matrix?.[1]?.[1]) !== 1234) {
              throw new Error(`${bookType} round-trip mismatch`)
            }
            console.log(`${bookType} round-trip PASS`, matrix.length, 'rows')
          }
          NODE
      - name: Validate lint
        run: npm run lint
      - name: Validate production build
        run: npm run build
      - name: Validate full tests
        run: npm test
      - name: Require zero npm audit findings
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/audit.json || true
          node <<'NODE'
          const fs=require('fs')
          const a=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'))
          const m=a.metadata?.vulnerabilities || {}
          console.log('Audit:', JSON.stringify(m))
          console.log('Packages:', Object.keys(a.vulnerabilities||{}).sort().join(', ') || '(none)')
          if (m.total !== 0) throw new Error('npm audit is not zero after official SheetJS upgrade')
          NODE
      - name: Commit SheetJS security upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Zactos-lab'
          git config user.email 'fikrirtc12@gmail.com'
          git add package.json package-lock.json
          git diff --cached --quiet && { echo 'No dependency changes'; exit 1; }
          git commit -m 'chore: upgrade SheetJS to secure official release'
          git push origin HEAD:security-npm-audit
