name: LEGACY - SAPDEV Validation Manual Only

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional validation note"
        required: false
        default: "manual check"

concurrency:
  group: sapdev-legacy-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Manual build and audit only
    runs-on: [self-hosted, sapdev]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show context
        run: |
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "This is a legacy manual-only validation workflow. Use OFFICIAL - SAPDEV Deploy Manual for normal deploy."
          node -v || true
          npm -v || true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build 2>&1 | tee /tmp/sap-build.log

      - name: Generate validation report
        if: always()
        run: |
          mkdir -p validation-report
          cp /tmp/sap-build.log validation-report/build.log 2>/dev/null || true
          {
            echo "# SAPDEV Legacy Manual Validation Report"
            echo
            echo "Generated: $(date)"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Note: ${{ github.event.inputs.note }}"
            echo
            echo "Use OFFICIAL - SAPDEV Deploy Manual for regular DEV deployment."
            echo
            echo "## Git Status"
            echo '```text'
            git status --short || true
            echo '```'
            echo
            echo "## Build Assets"
            echo '```text'
            find dist/assets -maxdepth 1 -type f -printf '%s %p\n' 2>/dev/null | sort -nr | awk '{printf "%.2f KB  %s\n", $1/1024, $2}' || true
            echo '```'
            echo
            echo "## Large Chunks > 800 KB"
            echo '```text'
            find dist/assets -maxdepth 1 -type f -name '*.js' -size +800k -printf '%s %p\n' 2>/dev/null | sort -nr | awk '{printf "%.2f KB  %s\n", $1/1024, $2}' || true
            echo '```'
          } > validation-report/sap-dev-validation.md

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapdev-legacy-validation-${{ github.run_number }}
          path: validation-report/
