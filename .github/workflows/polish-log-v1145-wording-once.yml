name: ONCE - Polish LOG v1.14.5 wording

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/polish-log-v1145-wording-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply final plain-language polish
        shell: python
        run: |
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); t=p.read_text()
              if old not in t: raise SystemExit(f'not found: {old}')
              p.write_text(t.replace(old,new,1))
          tool='src/tools/ToolLogAutoRcaV5.jsx'
          table='src/tools/components/VirtualResourceTableV14.jsx'
          rep(tool, "MEMORY_BLOCKING_CONTENTION: 'Memory Pressure + Blocking Signals'", "MEMORY_BLOCKING_CONTENTION: 'High Memory Pressure with Blocked Work Processes'")
          rep(tool, "MEMORY_IO_CONTENTION: 'Memory + I/O Pressure Signals'", "MEMORY_IO_CONTENTION: 'Memory Pressure with I/O Activity'")
          rep(tool, "NFS_IO_CONTENTION: 'NFS / I/O Blocking Signals'", "NFS_IO_CONTENTION: 'NFS I/O Blocking'")
          rep(tool, "BLOCK_IO_CONTENTION: 'Block I/O Pressure Signals'", "BLOCK_IO_CONTENTION: 'Block I/O Pressure'")
          rep(tool, "IO_STALL_CONTENTION: 'I/O Stall Signals'", "IO_STALL_CONTENTION: 'I/O Stall'")
          rep(tool, "MEMORY_RECLAIM_STALL: 'Memory Reclaim Signals'", "MEMORY_RECLAIM_STALL: 'Memory Reclaim Activity'")
          rep(tool, "CPU_SATURATION: 'CPU Saturation Signals'", "CPU_SATURATION: 'High CPU Utilization'")
          rep(tool, "MEMORY_PRESSURE: 'Memory Pressure'", "MEMORY_PRESSURE: 'High Memory Pressure'")
          rep(tool, "CPU_PRESSURE: 'CPU Pressure'", "CPU_PRESSURE: 'High CPU Pressure'")
          rep(tool, "{confirmed ? 'SUPPORTED' : 'INCONCLUSIVE'}", "{confirmed ? 'IDENTIFIED' : 'UNRESOLVED'}")
          rep(tool, '<div><span>Host / time</span>', '<div><span>Server and time</span>')
          rep(tool, "· RCA priority {verdict.topCausalScore ?? 0} · victim {verdict.topVictimScore ?? 0}", "· RCA priority {verdict.topCausalScore ?? 0} · blocked {verdict.topVictimScore ?? 0}")
          rep(tool, '<span className="logV2ScoreBadge">Victim {item.victimScore}</span>', '<span className="logV2ScoreBadge">Blocked {item.victimScore}</span>')
          rep(tool, '<div><dt>D-state / PIDs</dt>', '<div><dt>D-state and PIDs</dt>')
          rep(tool, '<div><dt>PSI mem / I/O full10</dt>', '<div><dt>PSI memory and I/O full10</dt>')
          rep(tool, "const [status, setStatus] = React.useState('Upload WP-SCOUT / Daily Check logs.')", "const [status, setStatus] = React.useState('Upload WP-SCOUT or Daily Check logs.')")
          rep(table, "header: 'Workload / Job'", "header: 'Workload or Job'")
          rep(table, "`${fmt(delta, 0)}m before`", "`${fmt(delta, 0)} min before`")
          rep(table, "`${fmt(delta, 0)}m after`", "`${fmt(delta, 0)} min after`")
          rep(table, 'workloads · sorted by incident priority', 'workloads · sorted by RCA priority')
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit polish
        run: |
          git config user.name "Zactos-lab"
          git config user.email "fikrirtc12@gmail.com"
          git add src/tools/ToolLogAutoRcaV5.jsx src/tools/components/VirtualResourceTableV14.jsx
          git commit -m "fix: finish LOG v1.14.5 plain-language labels"
          git push origin HEAD:dev
