name: SPHERE Repository Naming Finalize

on:
  push:
    branches:
      - cleanup-unused-files
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rename remaining safe RCA-named files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          moves = {
            'docs/rca-refactor-status.md': 'docs/sphere-refactor-status.md',
            'docs/sap-rca-current-status.md': 'docs/sphere-current-status.md',
            'docs/sap-rca-workspace-dynatrace-polish.md': 'docs/sphere-workspace-dynatrace-polish.md',
            'docs/sql/grafana-rca-views.sql': 'docs/sql/grafana-sphere-views.sql',
            'ops/wp-scout-rca-telemetry-v13.sh': 'ops/wp-scout-sphere-telemetry-v13.sh',
          }
          for old, new in moves.items():
            src, dst = Path(old), Path(new)
            if src.exists():
              dst.parent.mkdir(parents=True, exist_ok=True)
              src.rename(dst)

          replacements = {
            'docs/rca-refactor-status.md': 'docs/sphere-refactor-status.md',
            'docs/sap-rca-current-status.md': 'docs/sphere-current-status.md',
            'docs/sap-rca-workspace-dynatrace-polish.md': 'docs/sphere-workspace-dynatrace-polish.md',
            'docs/sql/grafana-rca-views.sql': 'docs/sql/grafana-sphere-views.sql',
            'ops/wp-scout-rca-telemetry-v13.sh': 'ops/wp-scout-sphere-telemetry-v13.sh',
            'SAP RCA Workspace': 'SPHERE',
            'SAP RCA': 'SPHERE',
            'SAP-RCA': 'SPHERE',
          }
          roots = [Path('docs'), Path('ops'), Path('README.md'), Path('documentation.txt')]
          files = []
          for root in roots:
            if root.is_file():
              files.append(root)
            elif root.exists():
              files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.md','.txt','.sql','.sh','.html','.mjs','.conf','.service'})
          for p in files:
            try:
              text = p.read_text(encoding='utf-8')
            except UnicodeDecodeError:
              continue
            original = text
            for old, new in replacements.items():
              text = text.replace(old, new)
            if text != original:
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validate remaining RCA filenames
        shell: bash
        run: |
          echo 'Remaining RCA-named files:'
          mapfile -t remaining < <(find . -type f -not -path './.git/*' -not -path './node_modules/*' | grep -Ei 'sap[-_]?rca|(^|/)[^/]*rca[^/]*$' || true)
          allowed='./backend/db/migrations/versions/20260509_0001_initial_sap_rca_schema.py'
          bad=0
          for f in "${remaining[@]}"; do
            echo "$f"
            if [ "$f" != "$allowed" ] && [ "$f" != './.github/workflows/sphere-repo-naming-finalize.yml' ]; then
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo 'Unexpected RCA-named file remains.' >&2
            exit 1
          fi
          echo 'Historical DB migration is intentionally retained unchanged.'

      - name: Validate renamed ops script syntax
        run: bash -n ops/wp-scout-sphere-telemetry-v13.sh
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Commit finalized naming
        shell: bash
        run: |
          git rm -f .github/workflows/sphere-repo-naming-finalize.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: finalize SPHERE naming outside frontend'
          git push origin HEAD:cleanup-unused-files
