name: Temporary LOG UI Polish

on:
  push:
    branches:
      - ui-log-consumers-polish
    paths:
      - .github/workflows/ui-log-consumers-polish.yml

permissions:
  contents: write

jobs:
  polish-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui-log-consumers-polish
          fetch-depth: 0

      - name: Apply UI polish
        run: python3 .github/ui-log-consumers-polish.py

      - name: Validate
        run: |
          set -Eeuo pipefail
          npm ci
          npm run lint
          npm test
          npm run build
          npm audit

      - name: Commit validated polish
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tools/ToolLogAutoSphereV5.jsx src/tools/components/VirtualResourceTableV14.jsx src/tools/LogAutoSphereV141.css
          git diff --cached --check
          git commit -m 'ui: polish LOG resource consumer table'
          git push origin HEAD:ui-log-consumers-polish
