name: ONCE - Install LOG v2 dependencies

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/install-log-v2-deps-once.yml

permissions:
  contents: write

jobs:
  install-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install analytics dependencies
        run: npm install --save @duckdb/duckdb-wasm echarts @tanstack/react-table@8 @tanstack/react-virtual@3
      - name: Build production bundle
        run: npm run build -- --base=/sap/
      - name: Validate LOG v2 bundle
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          grep -R -q 'TIME-FIRST' dist/assets
          grep -R -q 'DuckDB-WASM' dist/assets
          grep -R -q 'All Workloads' dist/assets
          grep -R -q '1.8.0' dist/assets
      - name: Commit dependency lockfiles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package changes to commit"
          else
            git commit -m "build: add LOG v2 analytics dependencies"
            git push origin HEAD:dev
          fi
