name: ONCE - Verify LOG v1.14.6 standard UX

on:
  push:
    branches:
      - fix/log-v1146-standard-mode-ux-20260831
    paths:
      - ops/tmp_patch_v1146.py

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/log-v1146-standard-mode-ux-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python ops/tmp_patch_v1146.py
      - name: Assert UX semantics
        run: |
          set -euo pipefail
          grep -q "APP_VERSION = '1.14.6'" src/app/version.js
          grep -q "RCA OPEN" src/tools/ToolLogAutoRcaV5.jsx
          grep -q "At incident time" src/tools/ToolLogAutoRcaV5.jsx
          grep -q "Not available in standard logs" src/tools/ToolLogAutoRcaV5.jsx
          grep -q "Total RSS (upper bound)" src/tools/components/LogLandscapeEChart.jsx
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Commit verified v1.14.6
        run: |
          git config user.name "Zactos-lab"
          git config user.email "fikrirtc12@gmail.com"
          git add src/tools/ToolLogAutoRcaV5.jsx src/tools/components/VirtualResourceTableV14.jsx src/tools/components/LogLandscapeEChart.jsx src/tools/LogAutoRcaV141.css src/app/version.js
          git commit -m "fix: finalize LOG standard-mode operator UX"
          git push origin HEAD:fix/log-v1146-standard-mode-ux-20260831
