name: ONCE - Verify LOG v1.14 full telemetry RCA

on:
  push:
    branches:
      - verify/log-v1-14-full-20260830

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run deterministic RCA tests
        run: npm test
      - name: Syntax check v1.13-v1.14 analytics
        run: |
          node --check src/tools/logAnalysisV14.js
          node --check src/tools/telemetryEnrichmentV13.js
          node --check src/tools/incidentTaxonomyV14.js
          node --check src/tools/workloadAnalyticsV5.js
          node --check src/tools/workers/logParserV14.worker.js
          bash -n ops/wp-scout-rca-telemetry-v13.sh
      - name: Build SAP bundle
        run: npm run build
