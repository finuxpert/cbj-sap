name: Temporary Repo Identity Fix

on:
  push:
    branches:
      - chore-align-repo-remote
    paths:
      - .github/workflows/repo-identity-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore-align-repo-remote
      - name: Replace stale repository references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = 'finuxpert/' + 'cbj-sap'
          new = 'finuxpert/sphere'
          changed = set()
          for path in Path('docs').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old, new)
              if path == Path('docs/PROJECT_CONTEXT.md'):
                  updated = updated.replace('`cbj-sap`', '`sphere`')
              if updated != text:
                  path.write_text(updated)
                  changed.add(str(path))
          if not changed:
              raise SystemExit('No stale repository references found to replace')
          print('Updated files:')
          for path in sorted(changed):
              print(path)
          PY
      - name: Verify exact old repository reference is gone
        shell: bash
        run: |
          set -euo pipefail
          old_repo='finuxpert/'"cbj-sap"
          ! grep -RInI -F "$old_repo" docs
          echo 'Compatibility identifiers still present (expected where host service/sudoers names are unchanged):'
          old_name='cbj-'"sap"
          grep -RInI -F "$old_name" docs || true
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
      - name: Commit documentation cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Zactos-lab'
          git config user.email 'fikrirtc12@gmail.com'
          git add docs
          git commit -m 'docs: align repository references with sphere'
          git push origin HEAD:chore-align-repo-remote
