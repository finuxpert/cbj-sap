name: Temporary Direct NPM Security Upgrade

on:
  push:
    branches:
      - security-npm-audit
    paths:
      - .github/workflows/npm-security-upgrade-direct.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-npm-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade vulnerable direct dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --save jspdf@4.2.1
          npm install --save-dev vitest@5.0.0
          node -e "const p=require('./package.json'); console.log({jspdf:p.dependencies.jspdf,vitest:p.devDependencies.vitest})"
      - name: Validate clean locked install
        run: npm ci
      - name: Validate lint
        run: npm run lint
      - name: Validate production build
        run: npm run build
      - name: Validate full tests
        run: npm test
      - name: Validate audit reduced to xlsx only
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/post.json || true
          node <<'NODE'
          const fs=require('fs')
          const a=JSON.parse(fs.readFileSync('/tmp/post.json','utf8'))
          const m=a.metadata?.vulnerabilities || {}
          const names=Object.keys(a.vulnerabilities||{}).sort()
          console.log('Remaining:', JSON.stringify(m))
          console.log('Remaining packages:', names.join(', '))
          if (m.total !== 1 || m.high !== 1 || m.critical !== 0 || m.moderate !== 0 || m.low !== 0) {
            throw new Error('Expected only one high vulnerability after direct upgrades')
          }
          if (JSON.stringify(names)!==JSON.stringify(['xlsx'])) throw new Error('Expected xlsx to be the only remaining vulnerable package')
          NODE
      - name: Show xlsx runtime usage
        shell: bash
        run: |
          set -euo pipefail
          echo '=== XLSX source references ==='
          grep -RInI --exclude-dir=node_modules --exclude-dir=.git --exclude='package-lock.json' -E "from ['\"]xlsx['\"]|require\(['\"]xlsx['\"]\)|XLSX\." src scripts backend . 2>/dev/null | head -200 || true
      - name: Commit direct dependency security upgrades
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Zactos-lab'
          git config user.email 'fikrirtc12@gmail.com'
          git add package.json package-lock.json
          git diff --cached --quiet && { echo 'No dependency changes'; exit 1; }
          git commit -m 'chore: upgrade jsPDF and Vitest for security'
          git push origin HEAD:security-npm-audit
