name: Temporary Lint Fix

on:
  push:
    branches:
      - fix-lint-baseline

permissions:
  contents: write

jobs:
  apply-lint-fix:
    if: github.event.head_commit.message == 'ci: add temporary lint fixer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-lint-baseline
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply minimal lint fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} match(es), found {actual}')
              p.write_text(text.replace(old, new, count))

          replace(
              'src/tools/components/VirtualResourceTableV14.jsx',
              "function evidenceLabel(value = '') {\n  return ({ EXACT_TARGET: 'Exact', NEAR_TARGET: 'Near', EARLY_TARGET: 'Early', LATE_TARGET: 'Late', OFF_TARGET: 'Off target', ADJACENT_TARGET: 'Adjacent' })[value] || 'None'\n}\n\n",
              '',
          )
          replace(
              'src/tools/components/VirtualResourceTableV14.jsx',
              'export const __test = { confidenceText, errorText, timingSuffix, errorTone, findingText, quickFilterMatch }',
              '// Test-only helper export intentionally shares this component module.\n// eslint-disable-next-line react-refresh/only-export-components\nexport const __test = { confidenceText, errorText, timingSuffix, errorTone, findingText, quickFilterMatch }',
          )
          replace(
              'src/tools/workloadAnalyticsV3.js',
              "    try { await conn?.close?.() } catch {}\n    try { await db?.terminate?.() } catch {}\n    try { worker?.terminate() } catch {}",
              "    try { await conn?.close?.() } catch { /* best-effort cleanup */ }\n    try { await db?.terminate?.() } catch { /* best-effort cleanup */ }\n    try { worker?.terminate() } catch { /* best-effort cleanup */ }",
          )
          replace(
              'vite.config.js',
              "import react from '@vitejs/plugin-react'\n",
              "import react from '@vitejs/plugin-react'\nimport process from 'node:process'\n",
          )
          replace(
              'src/tools/ToolSt03nAnalysis2026.jsx',
              "  const workload = analysis?.workloadTransactions || analysis?.transactions || []",
              "  const workload = React.useMemo(() => analysis?.workloadTransactions || analysis?.transactions || [], [analysis?.workloadTransactions, analysis?.transactions])",
          )
          replace(
              'src/tools/components/LogLandscapeEChart.jsx',
              "  const collections = rca?.collections || []",
              "  const collections = React.useMemo(() => rca?.collections || [], [rca?.collections])",
          )
          replace(
              'src/tools/components/LogLandscapeEChartV14.jsx',
              "  const collections = rca?.collections || []",
              "  const collections = React.useMemo(() => rca?.collections || [], [rca?.collections])",
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate lint
        run: npm run lint
      - name: Validate build
        run: npm run build
      - name: Validate full tests
        run: npm test
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Zactos-lab'
          git config user.email 'fikrirtc12@gmail.com'
          git add src/tools/components/VirtualResourceTableV14.jsx src/tools/workloadAnalyticsV3.js vite.config.js src/tools/ToolSt03nAnalysis2026.jsx src/tools/components/LogLandscapeEChart.jsx src/tools/components/LogLandscapeEChartV14.jsx
          git commit -m 'fix: clear lint baseline without behavior changes'
          git push origin HEAD:fix-lint-baseline
