name: ONCE - Verify LOG v1.14.1 operator accuracy

on:
  push:
    branches:
      - fix/log-v1-14-1-operator-accuracy-20260830

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run deterministic RCA tests
        run: npm test
      - name: Syntax checks
        run: |
          node --check src/tools/logAnalysisV14.js
          node --check src/tools/telemetryEnrichmentV13.js
          node --check src/tools/incidentTaxonomyV14.js
          node --check src/tools/workloadAnalyticsV5.js
      - name: Build SAP bundle
        run: npm run build
