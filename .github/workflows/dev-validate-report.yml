name: DEV Validate Report

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: sap-dev-validate-report
  cancel-in-progress: false

jobs:
  validate-dev:
    name: Build, deploy DEV, and write validation report
    runs-on: self-hosted
    env:
      FORCE_COLOR: "0"
      NO_COLOR: "1"
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 5

      - name: Show environment
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          echo "Workdir: $PWD"
          node -v
          npm -v

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        run: |
          set -o pipefail
          npm run build -- --clearScreen false 2>&1 | tee /tmp/sap-dev-build.log

      - name: Deploy to DEV path
        run: |
          set -euo pipefail
          sudo rm -rf /var/www/svr01-dev/sap/*
          sudo cp -rv dist/* /var/www/svr01-dev/sap/ | tee /tmp/sap-dev-deploy-copy.log
          sudo chown -R www-data:www-data /var/www/svr01-dev/sap
          sudo find /var/www/svr01-dev/sap -type d -exec chmod 755 {} \;
          sudo find /var/www/svr01-dev/sap -type f -exec chmod 644 {} \;
          find /var/www/svr01-dev/sap/assets -type f | sort > /tmp/sap-dev-assets.log

      - name: Live checks
        run: |
          set -o pipefail
          curl -I https://sapdev.cbj-kontruksi.com/sap/ 2>&1 | tee /tmp/sap-dev-http.log
          curl -s https://sapdev.cbj-kontruksi.com/sap-api/health | tee /tmp/sap-dev-api.json
          echo >> /tmp/sap-dev-api.json

      - name: Write validation report
        run: |
          set -euo pipefail
          mkdir -p docs/validation
          REPORT=docs/validation/dev-latest.md
          BUILD_STATUS="green"
          if grep -Ei "error|failed" /tmp/sap-dev-build.log >/dev/null; then BUILD_STATUS="check-log"; fi
          HTTP_STATUS=$(awk '/^HTTP\// {print $2; exit}' /tmp/sap-dev-http.log || true)
          ASSET_COUNT=$(wc -l < /tmp/sap-dev-assets.log | tr -d ' ')
          LAST_MODIFIED=$(awk -F': ' 'tolower($1)=="last-modified" {print $2}' /tmp/sap-dev-http.log | tr -d '\r' || true)
          cat > "$REPORT" <<EOF
          # SAP DEV Validation Latest

          Generated: $(date -Iseconds)

          ## Git

          - Branch: dev
          - Commit: $(git rev-parse --short HEAD)
          - Commit subject: $(git log -1 --pretty=%s)
          - Runner host: $(hostname)

          ## Build

          - Status: ${BUILD_STATUS}

          \`\`\`text
          $(grep -E "✓ built|warning|error|Generated an empty chunk|Some chunks|index-.*\.js|jszip-.*\.js|xlsx-.*\.js|jspdf.*\.js|recharts-.*\.js|LogEvidenceCharts-.*\.js" /tmp/sap-dev-build.log || true)
          \`\`\`

          ## Deploy

          - Target: /var/www/svr01-dev/sap
          - Asset count: ${ASSET_COUNT}

          ## Live Check

          - URL: https://sapdev.cbj-kontruksi.com/sap/
          - HTTP status: ${HTTP_STATUS:-unknown}
          - Last modified: ${LAST_MODIFIED:-unknown}

          \`\`\`text
          $(cat /tmp/sap-dev-http.log)
          \`\`\`

          ## API Health

          \`\`\`json
          $(cat /tmp/sap-dev-api.json)
          \`\`\`
          EOF
          sed -i 's/^          //' "$REPORT"

      - name: Commit validation report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/dev-latest.md
          if git diff --cached --quiet; then
            echo "No validation report changes."
          else
            git commit -m "Update DEV validation report [skip ci]"
            git push origin dev
          fi

      - name: Upload validation logs
        uses: actions/upload-artifact@v4
        with:
          name: sap-dev-validation-logs
          path: |
            /tmp/sap-dev-build.log
            /tmp/sap-dev-deploy-copy.log
            /tmp/sap-dev-http.log
            /tmp/sap-dev-api.json
            /tmp/sap-dev-assets.log
