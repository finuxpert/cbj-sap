name: ONE-TIME - LOG Incident Window Refactor

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch-log-window:
    if: ${{ github.event.head_commit.message == 'ops: run LOG incident-window refactor' }}
    runs-on:
      - self-hosted
      - sapdev
    timeout-minutes: 20
    steps:
      - name: Clone DEV in isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          WORK="/tmp/cbj-sap-log-window-${GITHUB_RUN_ID}"
          rm -rf "$WORK"
          REMOTE="$(git -C /home/sadmin/sap remote get-url origin)"
          git clone "$REMOTE" "$WORK"
          cd "$WORK"
          git checkout dev
          git reset --hard origin/dev
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Apply refactor
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          python3 scripts/log-window-refactor.py

      - name: Validate build
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          npm ci
          npm run build
          test -f dist/index.html

      - name: Commit refactor to DEV
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          git config user.name "Zactos-lab"
          git config user.email "fikrirtc12@gmail.com"
          git add src/tools/logView2026.js src/tools/ToolLogAnalysis2026.jsx src/tools/components/LogLandscapeCompare.jsx src/tools/components/IncidentLifecycleInsights.jsx src/app/version.js
          git diff --cached --check
          git commit -m "feat: technical incident windows and evidence gap semantics"
          git push origin HEAD:dev
