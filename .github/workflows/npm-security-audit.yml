name: Temporary NPM Security Audit

on:
  push:
    branches:
      - security-npm-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture npm audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs = require('fs')
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'))
          console.log('=== SUMMARY ===')
          console.log(JSON.stringify(audit.metadata?.vulnerabilities || {}, null, 2))
          console.log('=== VULNERABILITIES ===')
          const vulns = audit.vulnerabilities || {}
          for (const [name, v] of Object.entries(vulns).sort((a,b) => a[0].localeCompare(b[0]))) {
            const via = (v.via || []).map(x => typeof x === 'string' ? x : `${x.source}:${x.title}`).join(' | ')
            console.log(JSON.stringify({name, severity:v.severity, isDirect:v.isDirect, range:v.range, fixAvailable:v.fixAvailable, via, effects:v.effects}, null, 2))
          }
          NODE
      - name: Show outdated direct packages
        run: npm outdated --json || true
      - name: Simulate non-breaking audit fix
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before.json
          npm audit fix --package-lock-only || true
          echo '=== POST-FIX AUDIT ==='
          npm audit --package-lock-only --json > /tmp/npm-audit-post.json || true
          node <<'NODE'
          const fs = require('fs')
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit-post.json', 'utf8'))
          console.log(JSON.stringify(audit.metadata?.vulnerabilities || {}, null, 2))
          NODE
          echo '=== LOCKFILE DIFF STAT ==='
          git diff --stat package-lock.json || true
          echo '=== LOCKFILE PACKAGE VERSION CHANGES ==='
          node <<'NODE'
          const fs = require('fs')
          const before = JSON.parse(fs.readFileSync('/tmp/package-lock.before.json','utf8'))
          const after = JSON.parse(fs.readFileSync('package-lock.json','utf8'))
          const b = before.packages || {}, a = after.packages || {}
          const rows=[]
          for (const key of new Set([...Object.keys(b), ...Object.keys(a)])) {
            const bv=b[key]?.version, av=a[key]?.version
            if (bv!==av) rows.push({package:key||'(root)', before:bv||null, after:av||null})
          }
          console.log(JSON.stringify(rows, null, 2))
          NODE
