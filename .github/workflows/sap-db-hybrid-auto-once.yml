name: SAP RCA DB Hybrid Auto Once

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/sap-db-hybrid-auto-once.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: sap-db-hybrid-auto-once
  cancel-in-progress: false

jobs:
  validate-db-hybrid:
    name: Validate SAP RCA PostgreSQL hybrid DB
    runs-on: [self-hosted, sapdev-pc-runner]
    timeout-minutes: 30

    steps:
      - name: Checkout SAP repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Sync local SAP repo
        run: |
          set -euo pipefail
          cd /home/sadmin/sap
          git fetch origin
          git checkout dev
          git pull origin dev

      - name: Preflight PostgreSQL DEV container
        run: |
          set -euo pipefail
          {
            echo "# SAP RCA DB Hybrid Auto Once Status"
            echo ""
            echo "Started: $(date -Is)"
            echo "Runner: ${RUNNER_NAME:-unknown}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "## PostgreSQL container"
            echo '```text'
            docker ps --filter "name=cbj-postgres-dev" || true
            echo '```'
            echo ""
            echo "## PostgreSQL env file"
            echo '```text'
            if [ -f /opt/postgres-sap-dev/.env ]; then
              echo "OK: /opt/postgres-sap-dev/.env exists"
            else
              echo "ERROR: /opt/postgres-sap-dev/.env missing"
            fi
            echo '```'
          } | tee /tmp/sap-db-hybrid-auto-status.md

          docker inspect cbj-postgres-dev >/dev/null
          test -f /opt/postgres-sap-dev/.env

      - name: Run Alembic migration
        run: |
          set -euo pipefail
          cd /home/sadmin/sap
          chmod +x scripts/run-sap-db-migration.sh
          scripts/run-sap-db-migration.sh

      - name: Run DB layer smoke test
        run: |
          set -euo pipefail
          cd /home/sadmin/sap
          chmod +x scripts/test-sap-db-layer.sh
          scripts/test-sap-db-layer.sh

      - name: Collect runtime status
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p docs/runtime
          {
            cat /tmp/sap-db-hybrid-auto-status.md 2>/dev/null || true
            echo ""
            echo "## Migration status"
            if [ -f /home/sadmin/sap/runtime-status/sap-db-migration-status.md ]; then
              cat /home/sadmin/sap/runtime-status/sap-db-migration-status.md
            else
              echo "Migration status file not found."
            fi
            echo ""
            echo "## Smoke status"
            if [ -f /home/sadmin/sap/runtime-status/sap-db-layer-smoke-status.md ]; then
              cat /home/sadmin/sap/runtime-status/sap-db-layer-smoke-status.md
            else
              echo "Smoke status file not found."
            fi
            echo ""
            echo "Finished: $(date -Is)"
          } | tee docs/runtime/sap-db-hybrid-auto-once-status.md
          cat docs/runtime/sap-db-hybrid-auto-once-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit runtime status
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin dev
          git add docs/runtime/sap-db-hybrid-auto-once-status.md
          if git diff --cached --quiet; then
            echo "No runtime status changes to commit."
            exit 0
          fi
          git commit -m "Update SAP RCA DB hybrid auto status [skip ci]"
          git push origin dev
