name: SAP RCA DB Layer Smoke Test

on:
  workflow_dispatch:
    inputs:
      target_runner:
        description: "Target self-hosted runner"
        required: true
        default: "sapdev-pc-runner"
        type: choice
        options:
          - sapdev-pc-runner

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: sap-db-layer-smoke-${{ inputs.target_runner }}
  cancel-in-progress: false

jobs:
  smoke:
    name: SAP RCA DB layer smoke test
    runs-on: [self-hosted, "${{ inputs.target_runner }}"]
    timeout-minutes: 20

    steps:
      - name: Checkout SAP repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Sync local SAP repo
        run: |
          set -euo pipefail
          cd /home/sadmin/sap
          git fetch origin
          git checkout dev
          git pull origin dev

      - name: Run DB layer smoke test
        run: |
          set -euo pipefail
          cd /home/sadmin/sap
          chmod +x scripts/test-sap-db-layer.sh
          scripts/test-sap-db-layer.sh

      - name: Copy smoke status into workspace
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p docs/runtime
          if [ -f /home/sadmin/sap/runtime-status/sap-db-layer-smoke-status.md ]; then
            cp /home/sadmin/sap/runtime-status/sap-db-layer-smoke-status.md docs/runtime/sap-db-layer-smoke-status.md
          else
            {
              echo "# SAP RCA DB Layer Smoke Status"
              echo ""
              echo "Last checked: $(date -Is)"
              echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo ""
              echo "Status file was not generated on runner."
            } > docs/runtime/sap-db-layer-smoke-status.md
          fi
          cat docs/runtime/sap-db-layer-smoke-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit smoke status
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin dev
          git add docs/runtime/sap-db-layer-smoke-status.md
          if git diff --cached --quiet; then
            echo "No SAP DB layer smoke status changes to commit."
            exit 0
          fi
          git commit -m "Update SAP RCA DB layer smoke status [skip ci]"
          git push origin dev
