name: ONCE - Verify LOG v2 audit fixes

on:
  push:
    branches:
      - fix/log-v2-audit-20260830
    paths:
      - src/tools/logAnalysis2026.js
      - src/tools/logAutoPeak2026.js
      - src/tools/duckdbResourceAnalytics.js
      - src/tools/ToolLogAutoRcaV2.jsx
      - src/tools/components/LogLandscapeEChart.jsx
      - src/tools/components/VirtualResourceTable.jsx
      - .github/workflows/verify-log-v2-audit.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Validate pure LOG engines
        run: |
          node --check src/tools/logAnalysis2026.js
          node --check src/tools/logAutoPeak2026.js
          node --input-type=module <<'NODE'
          import { parseLogText } from './src/tools/logAnalysis2026.js'
          import { snapshotSeverityAuto, buildAutoPeakRca } from './src/tools/logAutoPeak2026.js'

          const parsed = parseLogText(`snapshot @ 2026-01-15 10:00\nHostname : AOPH1PAPPDC\nMemory : used 10G (25%), free 30G / 40G\nTotal WP Critical : 0`, 'sample.log')
          if (parsed.telemetry.length !== 1) throw new Error('expected one telemetry row')
          if (parsed.telemetry[0].cpuPct !== null) throw new Error('missing CPU must remain null')
          if (parsed.telemetry[0].memoryPct !== 25) throw new Error('memory parse regression')

          const wpOnly = snapshotSeverityAuto({ cpuPct: 10, memoryPct: 55, loadRatio: 0.2, swapIn: 0, wpCritical: 22 })
          if (wpOnly !== 'WARN') throw new Error(`WP-only severity must be WARN, got ${wpOnly}`)

          const rca = buildAutoPeakRca({
            telemetry: [
              { fileName: 'combined.log', snapshot: '2026-01-15 10:00', timeLabel: '2026-01-15 10:00', sortKey: 20260115100000, host: 'APP1', cpuPct: 10, memoryPct: 20, loadRatio: 0.1, swapIn: 0, wpCritical: 0 },
              { fileName: 'combined.log', snapshot: '2026-01-15 10:10', timeLabel: '2026-01-15 10:10', sortKey: 20260115101000, host: 'APP1', cpuPct: 20, memoryPct: 30, loadRatio: 0.2, swapIn: 0, wpCritical: 0 },
            ],
            processes: [],
          })
          if (rca.collections.length !== 2) throw new Error(`snapshot-first collection expected 2, got ${rca.collections.length}`)
          NODE
      - name: Validate adaptive ranking safeguards
        run: |
          grep -q "hostSampleCount" src/tools/duckdbResourceAnalytics.js
          grep -q "cpu === null ? '' : cpu" src/tools/duckdbResourceAnalytics.js
          grep -q "Observed Workloads" src/tools/ToolLogAutoRcaV2.jsx
          grep -q "Ranking observed workloads" src/tools/ToolLogAutoRcaV2.jsx
      - name: Build production bundle
        run: npm run build -- --base=/sap/
