name: Deploy SAP RCA Workspace to sapdev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: sapdev-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, deploy, and QA sapdev
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Show runner and commit
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          echo "Commit: $GITHUB_SHA"
          git log --oneline -5

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Build Vite app
        run: |
          set -euo pipefail
          npm run build

      - name: Deploy dist to sapdev web root
        run: |
          set -euo pipefail
          sudo rm -rf /var/www/svr01-dev/sap/*
          sudo cp -rv dist/* /var/www/svr01-dev/sap/
          sudo chown -R www-data:www-data /var/www/svr01-dev/sap
          sudo find /var/www/svr01-dev/sap -type d -exec chmod 755 {} \;
          sudo find /var/www/svr01-dev/sap -type f -exec chmod 644 {} \;

      - name: Reload nginx
        run: |
          set -euo pipefail
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Restart Evidence API
        run: |
          set -euo pipefail
          sudo systemctl restart sap-evidence-api.service
          sleep 2
          curl -f http://127.0.0.1:8090/health

      - name: Run sapdev backend and frontend QA
        run: |
          set -euo pipefail
          bash scripts/qa-sapdev.sh
