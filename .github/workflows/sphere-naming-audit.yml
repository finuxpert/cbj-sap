name: SPHERE Naming Apply

on:
  push:
    branches:
      - cleanup-unused-files
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply SPHERE naming
        shell: bash
        run: |
          npm pkg set name=sphere
          npm install --package-lock-only --ignore-scripts
          sed -i 's#finuxpert/cbj-sap#finuxpert/sphere#g' scripts/run-backend-safe-refactor.sh
      - name: Install dependencies
        run: npm ci
      - name: Validate exact legacy repo naming
        shell: bash
        run: |
          if git grep -nEi 'cbj[-_ ]?sap|cbjsap' -- ':!docs/**' ':!src/comparer-rca-final.css' ':!.github/workflows/sphere-naming-audit.yml'; then
            echo 'Unexpected active cbj-sap naming remains.' >&2
            exit 1
          fi
          test "$(node -p "require('./package.json').name")" = "sphere"
          test "$(node -p "require('./package-lock.json').name")" = "sphere"
      - name: Build
        id: build
        run: npm run build
      - name: Test
        id: test
        run: npm test
      - name: Lint baseline
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Commit naming changes when needed
        shell: bash
        run: |
          git add package.json package-lock.json scripts/run-backend-safe-refactor.sh
          if git diff --cached --quiet; then
            echo 'No naming changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: align active project naming with SPHERE'
          git push origin HEAD:cleanup-unused-files
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "# SPHERE naming validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- package name: sphere" >> "$GITHUB_STEP_SUMMARY"
          echo "- repository refs: finuxpert/sphere" >> "$GITHUB_STEP_SUMMARY"
          echo "- build: ${{ steps.build.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- test: ${{ steps.test.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- lint: ${{ steps.lint.outcome }}" >> "$GITHUB_STEP_SUMMARY"
