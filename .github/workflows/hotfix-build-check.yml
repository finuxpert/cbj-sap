name: CHECK - Automatic Peak RCA Hotfix

on:
  push:
    branches:
      - prod-hotfix-auto-peak

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hotfix
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build -- --base=/sap/
      - name: Validate automatic peak bundle
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          grep -q '/sap/assets/' dist/index.html
          grep -R -q 'AUTOMATIC PEAK CORRELATION' dist/assets
          grep -R -q '1.7.0' dist/assets
