name: Apply SPHERE v1.16.2 Operations UX

on:
  push:
    branches:
      - ui-ops-v1162
    paths:
      - .github/workflows/apply-v1162.yml

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-ops-v1162
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.16.2 source patch
        run: node scripts/apply-v1162.mjs
      - name: Add Radix accordion primitive
        run: npm install @radix-ui/react-accordion --save
      - name: Validate wiring
        run: |
          set -Eeuo pipefail
          grep -q "APP_VERSION = '1.16.2'" src/app/version.js
          grep -q "APP_PREVIOUS_VERSION = '1.16.1'" src/app/version.js
          grep -q "@radix-ui/react-accordion" package.json
          grep -q "log-ops-v1162.css" src/app/enterprise-theme.css
          grep -q "I/O Wait WP" src/tools/components/VirtualResourceTableV14.jsx
          grep -q "Analysis Result" src/tools/ToolLogAutoSphereV5.jsx
          grep -q "View all" src/tools/ToolLogAutoSphereV5.jsx
      - name: Clean install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit
      - name: Diff check
        run: git diff --check
      - name: Commit validated product changes
        run: |
          set -Eeuo pipefail
          git config user.name "Zactos-lab"
          git config user.email "fikrirtc12@gmail.com"
          git add package.json package-lock.json \
            src/app/version.js src/app/enterprise-theme.css src/app/log-ops-v1162.css \
            src/tools/ToolLogAutoSphereV5.jsx src/tools/components/VirtualResourceTableV14.jsx
          git diff --cached --quiet && { echo "No product changes to commit"; exit 1; }
          git commit -m "ui: introduce SPHERE v1.16.2 operations UX"
          git push origin HEAD:ui-ops-v1162
