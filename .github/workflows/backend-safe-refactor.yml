name: Backend Safe Refactor

on:
  workflow_dispatch:
    inputs:
      CONFIRM_BACKEND_REFACTOR:
        description: "Type APPLY_BACKEND_REFACTOR to run model + storage refactor"
        required: true
        default: ""

permissions:
  contents: write

concurrency:
  group: backend-safe-refactor
  cancel-in-progress: false

jobs:
  refactor:
    name: Apply safe backend refactors
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Validate confirmation
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.CONFIRM_BACKEND_REFACTOR }}" != "APPLY_BACKEND_REFACTOR" ]; then
            echo "Confirmation input mismatch. Refactor intentionally skipped."
            exit 1
          fi

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show runner and commit
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          echo "Commit: $GITHUB_SHA"
          git status --short

      - name: Apply deterministic model refactor
        run: |
          set -euo pipefail
          python3 scripts/refactor-evidence-api-models.py

      - name: QA after model refactor
        run: |
          set -euo pipefail
          bash scripts/qa-backend-syntax.sh

      - name: Apply deterministic storage refactor
        run: |
          set -euo pipefail
          python3 scripts/refactor-evidence-api-storage.py

      - name: QA after storage refactor
        run: |
          set -euo pipefail
          bash scripts/qa-backend-syntax.sh

      - name: Show combined refactor diff
        run: |
          set -euo pipefail
          git diff -- backend/evidence_api.py backend/models.py backend/external_models.py backend/storage_config.py backend/storage_helpers.py scripts/qa-backend-syntax.sh

      - name: Commit refactor if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No backend refactor changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/evidence_api.py backend/models.py backend/external_models.py backend/storage_config.py backend/storage_helpers.py scripts/qa-backend-syntax.sh
          git commit -m "Use external backend models and storage helpers"
          git push origin HEAD:dev

      - name: Refactor summary
        if: always()
        run: |
          {
            echo "# Backend Safe Refactor"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Runner: $(hostname)"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Result: ${{ job.status }}"
            echo
            echo "This workflow runs model refactor first, then storage refactor, with backend QA after each phase."
          } >> "$GITHUB_STEP_SUMMARY"
