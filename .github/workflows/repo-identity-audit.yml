name: Temporary Repo Identity Audit

on:
  push:
    branches:
      - chore-align-repo-remote
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit stale repository references
        shell: bash
        run: |
          set -euo pipefail
          old_repo='finuxpert/'"cbj-sap"
          old_name='cbj-'"sap"
          echo '=== exact old repository references ==='
          if grep -RInI --exclude-dir=.git --exclude='package-lock.json' -F "$old_repo" .; then
            echo 'ERROR: stale old repository references remain'
            exit 1
          fi
          echo 'No exact old repository references found.'
          echo '=== broad old repository-name references ==='
          if grep -RInI --exclude-dir=.git -F "$old_name" .; then
            echo 'ERROR: broad old repository-name references remain'
            exit 1
          fi
          echo 'No old repository-name references found.'
      - name: Validate workflow syntax-sensitive files
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
