name: Cleanup Action History

on:
  push:
    branches:
      - cleanup-unused-files
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-action-history
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed workflow run history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_REPOSITORY GH_TOKEN

          for pass in 1 2 3; do
            echo "Cleanup pass ${pass}"
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[].id' > /tmp/workflow_run_ids.txt

            total=$(wc -l < /tmp/workflow_run_ids.txt | tr -d ' ')
            echo "Completed runs found: ${total}"
            if [ "${total}" -eq 0 ]; then
              break
            fi

            xargs -r -n1 -P8 bash -c '
              run_id="$1"
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null 2>&1 || true
            ' _ < /tmp/workflow_run_ids.txt

            sleep 2
          done

          remaining=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=1" \
            --jq '.total_count')

          echo "Completed workflow runs remaining: ${remaining}"
          if [ "${remaining}" -ne 0 ]; then
            exit 1
          fi
