name: ONCE - Apply LOG v1.14.4 operator final

on:
  push:
    branches:
      - fix/log-v1-14-4-operator-final-20260830
    paths:
      - .github/workflows/apply-log-v1144-once.yml

permissions:
  contents: write

jobs:
  apply-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/log-v1-14-4-operator-final-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply v1.14.4 operator polish
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected snippet not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Incident summary: expose role so top candidate cannot be mistaken for a confirmed culprit.
          replace_exact(
              'src/tools/ToolLogAutoRcaV5.jsx',
              "<div><span>Top candidate</span><strong>{verdict.topWorkload || '—'}</strong><small>{verdict.topHost || '—'} · priority {verdict.topCausalScore ?? 0} · victim {verdict.topVictimScore ?? 0}</small></div>",
              "<div><span>Top candidate</span><strong>{verdict.topWorkload || '—'}</strong><small>{verdict.topHost || '—'} · {humanize(topRow?.incidentRole || 'UNKNOWN')} · priority {verdict.topCausalScore ?? 0} · victim {verdict.topVictimScore ?? 0}</small></div>",
          )

          # Host peak table: make full-window semantics explicit.
          replace_exact(
              'src/tools/ToolLogAutoRcaV5.jsx',
              '<div className="logV2PanelHead"><div><h2>Application Server Peaks</h2></div></div>',
              '<div className="logV2PanelHead"><div><h2>Application Server Peaks</h2><p>Maximum observed per host across the full analysis window.</p></div></div>',
          )
          replace_exact(
              'src/tools/ToolLogAutoRcaV5.jsx',
              '<th>Host</th><th>Operational</th><th>Resource</th><th>Peak</th><th>Time</th><th>Run</th>',
              '<th>Host</th><th>Operational</th><th>Resource</th><th>Window Peak</th><th>Peak Time</th><th>Run</th>',
          )

          # Compact ranking: persistent error signals are context, not visually causal.
          replace_exact(
              'src/tools/components/VirtualResourceTableV14.jsx',
              "function errorText(row = {}) {\n  const taxonomy = row.errorTaxonomy || {}\n  const strongest = taxonomy.strongest || {}\n  const category = strongest.category\n  if (category && category !== 'NONE') {\n    const suffix = timingSuffix(strongest.timing, taxonomy.direction)\n    return `${humanize(category)}${suffix ? ` · ${suffix}` : ''}`\n  }\n  if (row.errorState && row.errorState !== 'NONE') return humanize(row.errorState)\n  return '—'\n}\n",
              "function errorText(row = {}) {\n  const taxonomy = row.errorTaxonomy || {}\n  const strongest = taxonomy.strongest || {}\n  const category = strongest.category\n  if (category && category !== 'NONE') {\n    const suffix = timingSuffix(strongest.timing, taxonomy.direction)\n    return `${humanize(category)}${suffix ? ` · ${suffix}` : ''}`\n  }\n  if (row.errorState && row.errorState !== 'NONE') return humanize(row.errorState)\n  return '—'\n}\n\nfunction errorTone(row = {}) {\n  const timing = row.errorTaxonomy?.strongest?.timing || {}\n  if (timing.state === 'PERSISTENT_NEAR_TARGET') return 'persistent'\n  if (timing.state === 'NEW_BEFORE_TARGET' || row.errorTaxonomy?.direction === 'POTENTIAL_PRECURSOR') return 'precursor'\n  if (timing.state === 'NEW_AT_TARGET') return 'at-target'\n  return ''\n}\n",
          )
          replace_exact(
              'src/tools/components/VirtualResourceTableV14.jsx',
              "{ id: 'error', accessorFn: (row) => row.errorTaxonomy?.strongest?.category || row.errorState || '', header: 'Error / Timing', size: 210, cell: ({ row }) => errorText(row.original) },",
              "{ id: 'error', accessorFn: (row) => row.errorTaxonomy?.strongest?.category || row.errorState || '', header: 'Error / Timing', size: 210, cell: ({ row }) => <span className={`logV143Error ${errorTone(row.original)}`}>{errorText(row.original)}</span> },",
          )
          replace_exact(
              'src/tools/components/VirtualResourceTableV14.jsx',
              'export const __test = { confidenceText, errorText, timingSuffix }',
              'export const __test = { confidenceText, errorText, timingSuffix, errorTone }',
          )

          # Workload chart uses the same concise incident marker as the landscape chart.
          replace_exact(
              'src/tools/components/LogLandscapeEChart.jsx',
              "markLine: markerTime ? { symbol: ['none', 'none'], data: [{ xAxis: markerTime, name: 'Landscape incident target' }], label: { formatter: 'Landscape incident target' }, lineStyle: { type: 'dashed' } } : undefined",
              "markLine: markerTime ? { silent: true, symbol: ['none', 'none'], data: [{ xAxis: markerTime, name: 'Incident' }], label: { formatter: 'INCIDENT', color: '#c3d0d4', backgroundColor: '#24343a', borderColor: '#3b5158', borderWidth: 1, borderRadius: 3, padding: [3, 5], fontSize: 9 }, lineStyle: { type: 'dashed', color: '#7f969e' } } : undefined",
          )

          # Small semantic color treatment: persistent = muted context; precursor/at-target retain attention.
          css = Path('src/tools/LogAutoRcaV141.css')
          css_text = css.read_text()
          addition = "\n/* v1.14.4: error timing semantics */\n.logV143Error.persistent{color:#71868d}\n.logV143Error.precursor{color:#d7b75b}\n.logV143Error.at-target{color:#d9c46d}\n"
          if '.logV143Error.persistent' not in css_text:
              css.write_text(css_text.rstrip() + addition)

          # Version metadata.
          replace_exact('src/app/version.js', "export const APP_VERSION = '1.14.3'", "export const APP_VERSION = '1.14.4'")
          replace_exact('src/app/version.js', "export const LOG_ANALYTICS_ENGINE = 'source-provenance-operator-final-v3.6.3'", "export const LOG_ANALYTICS_ENGINE = 'legacy-final-ui-semantics-v3.6.4'")
          replace_exact('src/app/version.js', "export const LOG_UI_REVISION = 'operator-console-provenance-timing-v3.6.3'", "export const LOG_UI_REVISION = 'operator-console-final-semantics-v3.6.4'")
          replace_exact('index.html', 'SAP RCA Workspace v1.14.3', 'SAP RCA Workspace v1.14.4')
          replace_exact('index.html', 'SAP RCA Workspace v1.14.3', 'SAP RCA Workspace v1.14.4')

      - name: Install dependencies
        run: npm ci
      - name: Run deterministic RCA tests
        run: npm test
      - name: Syntax checks
        run: |
          node --check src/tools/logRcaEngineV3.js
          node --check src/tools/logAnalysisV14.js
          node --check src/tools/telemetryEnrichmentV13.js
          node --check src/tools/incidentTaxonomyV14.js
          node --check src/tools/workloadAnalyticsV5.js
      - name: Build SAP bundle
        run: npm run build

      - name: Commit verified v1.14.4
        run: |
          git config user.name "Zactos-lab"
          git config user.email "fikrirtc12@gmail.com"
          git add index.html src/app/version.js src/tools/ToolLogAutoRcaV5.jsx src/tools/LogAutoRcaV141.css src/tools/components/VirtualResourceTableV14.jsx src/tools/components/LogLandscapeEChart.jsx
          git commit -m "fix: finalize LOG v1.14.4 operator semantics"
          git push origin HEAD:fix/log-v1-14-4-operator-final-20260830
