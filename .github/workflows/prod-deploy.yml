name: OFFICIAL - SPHERE PROD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sphere-prod-deploy
  cancel-in-progress: false

jobs:
  deploy-prod:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-prod]')
    runs-on:
      - self-hosted
      - sapdev
    timeout-minutes: 25

    env:
      PROD_HOST: 103.49.238.87
      PROD_USER: sadmin
      PROD_WEBROOT: /var/www/html/sap

    steps:
      - name: Prepare isolated main worktree
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DIR="/home/sadmin/prod-build-${GITHUB_RUN_ID}"
          echo "BUILD_DIR=${BUILD_DIR}" >> "$GITHUB_ENV"
          cd /home/sadmin/sap
          git fetch origin main
          git worktree prune
          rm -rf "${BUILD_DIR}"
          git worktree add --detach "${BUILD_DIR}" origin/main
          cd "${BUILD_DIR}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Prepared main commit $(git rev-parse --short HEAD)"

      - name: Validate main and build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "${BUILD_DIR}"
          echo "Deploying commit: ${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "main"
          npm ci
          npx vitest run src/tools/__tests__/logParserV15Parity.test.js src/tools/__tests__/logV22Parser.test.js
          npm run build
          test -f dist/index.html
          test -d dist/assets
          grep -R -m1 "1.15.4" dist/assets >/dev/null

      - name: Production preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE="${PROD_USER}@${PROD_HOST}"
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new"
          ssh ${SSH_OPTS} "${REMOTE}" "set -Eeuo pipefail; \
            test -d '${PROD_WEBROOT}'; \
            test -f '${PROD_WEBROOT}/index.html'; \
            sudo -n true; \
            command -v rsync >/dev/null; \
            command -v tar >/dev/null; \
            command -v nginx >/dev/null; \
            echo 'PROD preflight OK'"

      - name: Backup, deploy, verify, and rollback on failure
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE="${PROD_USER}@${PROD_HOST}"
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new"
          STAMP="$(date +%Y%m%d_%H%M%S)"
          REMOTE_STAGE="/home/sadmin/deploy/sap-main-${GITHUB_SHA}"
          BACKUP_DIR="/home/sadmin/Backup/sap-webroot"
          BACKUP_FILE="${BACKUP_DIR}/sap-webroot_${STAMP}.tar.gz"

          echo "Staging build on production host..."
          ssh ${SSH_OPTS} "${REMOTE}" "set -Eeuo pipefail; rm -rf '${REMOTE_STAGE}'; mkdir -p '${REMOTE_STAGE}'; sudo mkdir -p '${BACKUP_DIR}'"
          rsync -az --delete -e "ssh ${SSH_OPTS}" "${BUILD_DIR}/dist/" "${REMOTE}:${REMOTE_STAGE}/"
          ssh ${SSH_OPTS} "${REMOTE}" "test -f '${REMOTE_STAGE}/index.html'"

          echo "Backing up current production webroot to ${BACKUP_FILE}"
          ssh ${SSH_OPTS} "${REMOTE}" "set -Eeuo pipefail; sudo tar -C /var/www/html -czf '${BACKUP_FILE}' sap"

          rollback() {
            echo "Production verification failed. Restoring ${BACKUP_FILE}"
            ssh ${SSH_OPTS} "${REMOTE}" "set -Eeuo pipefail; \
              sudo rm -rf '${PROD_WEBROOT}'; \
              sudo tar -xzf '${BACKUP_FILE}' -C /var/www/html; \
              sudo chown -R www-data:www-data '${PROD_WEBROOT}'; \
              sudo find '${PROD_WEBROOT}' -type d -exec chmod 755 {} +; \
              sudo find '${PROD_WEBROOT}' -type f -exec chmod 644 {} +; \
              sudo nginx -t; \
              sudo systemctl reload nginx"
          }
          trap rollback ERR

          echo "Publishing main build to ${PROD_WEBROOT}"
          ssh ${SSH_OPTS} "${REMOTE}" "set -Eeuo pipefail; \
            sudo rsync -a --delete '${REMOTE_STAGE}/' '${PROD_WEBROOT}/'; \
            sudo chown -R www-data:www-data '${PROD_WEBROOT}'; \
            sudo find '${PROD_WEBROOT}' -type d -exec chmod 755 {} +; \
            sudo find '${PROD_WEBROOT}' -type f -exec chmod 644 {} +; \
            sudo grep -R -m1 '1.15.4' '${PROD_WEBROOT}/assets' >/dev/null; \
            sudo nginx -t; \
            sudo systemctl reload nginx"

          echo "External smoke test..."
          HTML="$(curl -fsS --retry 5 --retry-delay 2 -H 'Cache-Control: no-cache' "https://cbj-kontruksi.com/sap/?deploy=${GITHUB_SHA}")"
          printf '%s' "${HTML}" | grep -q '/sap/assets/'

          trap - ERR
          ssh ${SSH_OPTS} "${REMOTE}" "rm -rf '${REMOTE_STAGE}'"
          echo "PROD deploy successful: https://cbj-kontruksi.com/sap/"
          echo "Backup retained: ${BACKUP_FILE}"

      - name: Production summary
        if: success()
        shell: bash
        run: |
          {
            echo "# SPHERE Production Deploy Success"
            echo
            echo "- Branch: main"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- URL: https://cbj-kontruksi.com/sap/"
            echo "- Version: v1.15.4"
            echo "- Backup: created before webroot replacement"
            echo "- Smoke test: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup build worktree
        if: always()
        shell: bash
        run: |
          set +e
          cd /home/sadmin/sap
          git worktree remove --force "${BUILD_DIR}" 2>/dev/null || rm -rf "${BUILD_DIR}"
          git worktree prune
