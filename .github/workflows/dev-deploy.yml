name: OFFICIAL - SAPDEV Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_DEV to confirm DEV deployment"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: sapdev-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Build, deploy, and QA SAPDEV
    if: github.event_name == 'push' || github.event.inputs.confirm == 'DEPLOY_DEV'
    runs-on:
      - self-hosted
      - sapdev
    timeout-minutes: 25

    steps:
      - name: Show runner context
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          echo "Workspace: $(pwd)"
          echo "Workflow commit: ${GITHUB_SHA}"
          echo "Official workflow file: .github/workflows/dev-deploy.yml"
          echo "Trigger: ${GITHUB_EVENT_NAME}"

      - name: Validate local project and deploy script
        run: |
          set -euo pipefail
          test -d /home/sadmin/sap
          test -x /home/sadmin/deploy-sap-dev.sh
          test -f /home/sadmin/sap/package.json
          test -f /home/sadmin/sap/backend/evidence_api.py
          test -f /home/sadmin/sap/backend/requirements.txt
          test -f /home/sadmin/sap/src/evidence-api-client.js

      - name: Sync DEV branch and validate build
        working-directory: /home/sadmin/sap
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout dev
          git reset --hard origin/dev
          echo "Local HEAD after sync: $(git rev-parse --short HEAD)"
          git log --oneline -5
          npm ci
          npm run build
          test -f dist/index.html
          test -d dist/assets

      - name: Install backend Python requirements
        working-directory: /home/sadmin/sap
        run: |
          set -euo pipefail
          python3 -m venv .venv-github-actions
          . .venv-github-actions/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          echo "/home/sadmin/sap/.venv-github-actions/bin" >> "$GITHUB_PATH"
          python - <<'PY'
          import fastapi
          import pydantic
          import sqlalchemy
          print('Backend Python requirements available')
          PY

      - name: Deploy DEV web bundle
        run: |
          set -euo pipefail
          /home/sadmin/deploy-sap-dev.sh

      - name: Validate local Evidence API
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8090/health | jq '{status:.status, case_history:.case_history, database:.database}'

      - name: Validate public SAPDEV API contracts
        run: |
          set -euo pipefail
          API="https://sapdev.cbj-kontruksi.com/sap-api"
          curl -fsS "${API}/health" | jq '{status:.status, case_history:.case_history, database:.database}'
          curl -fsS "${API}/cases?limit=20" | jq '{ok:.ok, read_source:(.read_source // "file"), mode:(.mode // "hybrid"), count:.count}'
          curl -fsS "${API}/mobile/cases?limit=20" | jq '{ok:.ok, count:.count}'
          curl -fsS "${API}/evidence-history?limit=20" | jq '{ok:.ok, read_source:.read_source, mode:.mode, count:.count, fallback_reason:(.fallback_reason // null)}'
          curl -fsS "${API}/parsed-results-history?limit=20" | jq '{ok:.ok, read_source:.read_source, mode:.mode, count:.count, fallback_reason:(.fallback_reason // null)}'

      - name: Run full SAPDEV QA suite
        working-directory: /home/sadmin/sap
        run: |
          set -euo pipefail
          bash scripts/qa-backend-syntax.sh
          bash scripts/qa-sapdev.sh

      - name: Workflow success summary
        if: success()
        run: |
          {
            echo "# OFFICIAL SAPDEV Deploy Success"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Runner: $(hostname)"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Workflow file: .github/workflows/dev-deploy.yml"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Status: SUCCESS"
            echo "- URL: https://sapdev.cbj-kontruksi.com/sap/"
            echo "- API: https://sapdev.cbj-kontruksi.com/sap-api/health"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show recent deploy log
        if: always()
        run: |
          tail -n 160 /home/sadmin/deploy-sap-dev.log || true

      - name: Workflow failure summary
        if: failure()
        run: |
          {
            echo "# OFFICIAL SAPDEV Deploy Failed"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Runner: $(hostname)"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Workflow file: .github/workflows/dev-deploy.yml"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Status: FAILED"
            echo
            echo "Check failed job logs and /home/sadmin/deploy-sap-dev.log."
          } >> "$GITHUB_STEP_SUMMARY"
